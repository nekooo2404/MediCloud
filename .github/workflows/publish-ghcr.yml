name: Publish MediCloud Images to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-images:
    name: Build & Push Docker Images to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Patient & Staff Portal
        id: meta_portal
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/patient-portal
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Patient & Staff Portal image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile.patient-portal
          push: true
          tags: ${{ steps.meta_portal.outputs.tags }}
          labels: ${{ steps.meta_portal.outputs.labels }}
          cache-from: type=gha,scope=patient-portal
          cache-to: type=gha,mode=max,scope=patient-portal
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp || 'manual-dispatch' }}

      - name: Extract metadata for Clinical API & Event Relay
        id: meta_clinical
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/clinical-api
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Clinical API & Event Relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile.clinical-api
          push: true
          tags: ${{ steps.meta_clinical.outputs.tags }}
          labels: ${{ steps.meta_clinical.outputs.labels }}
          cache-from: type=gha,scope=clinical-api
          cache-to: type=gha,mode=max,scope=clinical-api
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp || 'manual-dispatch' }}
